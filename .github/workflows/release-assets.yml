name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: false
        type: string

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Create or update GitHub release
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG_NAME" main.js manifest.json styles.css --title "$TAG_NAME" --generate-notes || gh release upload "$TAG_NAME" main.js manifest.json styles.css --clobber
        env:
          GH_TOKEN: ${{ github.token }}
